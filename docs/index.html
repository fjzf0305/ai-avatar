<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 卡通头像生成</title>
  <meta name="description" content="上传一张照片，AI 帮你生成专属卡通头像。3D 卡通、日系动漫、Q 版等多种风格。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>AI 卡通头像</h1>
      <p class="sub">上传一张照片，一分钟内生成专属卡通头像</p>
    </header>

    <section aria-labelledby="s1">
      <h2 id="s1">1. 上传照片</h2>
      <label class="upload" for="file">
        <img id="preview" alt="已选择的照片预览" hidden>
        <span id="uploadHint">点击选择照片<br><small>正脸、光线好、五官清晰效果最好</small></span>
      </label>
      <input id="file" type="file" accept="image/*" class="visually-hidden">
    </section>

    <section aria-labelledby="s2">
      <h2 id="s2">2. 选择风格</h2>
      <div id="styles" class="styles" role="radiogroup" aria-labelledby="s2"></div>
    </section>

    <section aria-labelledby="s3">
      <h2 id="s3">3. 输入兑换码</h2>
      <div class="row">
        <label for="code" class="visually-hidden">兑换码</label>
        <input id="code" type="text" inputmode="text" autocomplete="off" placeholder="例如 ABCD-EFGH-JKMN" maxlength="20">
        <button id="checkBtn" type="button" class="secondary">查询次数</button>
      </div>
      <p class="hint">还没有兑换码？<a id="buyLink" href="#" target="_blank" rel="noopener">点这里购买</a></p>
    </section>

    <button id="genBtn" type="button" class="primary">生成头像</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" hidden aria-labelledby="s4">
      <h2 id="s4">生成结果</h2>
      <img id="resultImg" alt="生成的卡通头像">
      <p class="hint">手机上长按图片即可保存。图片链接 24 小时内有效，请及时保存。</p>
      <a id="openLink" href="#" target="_blank" rel="noopener" class="secondary btn">打开原图</a>
    </section>

    <footer>
      <details>
        <summary>隐私说明</summary>
        <p>你上传的照片只用于本次生成，本站不保存照片和生成结果。照片会发送给 AI 服务商（阿里云、火山引擎或硅基流动）进行处理，并经过其内容安全审核。请勿上传他人照片或违法违规内容。</p>
        <p>生成内容由人工智能生成。生成失败或审核未通过不扣次数。</p>
      </details>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
